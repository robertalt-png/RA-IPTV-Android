server {
    listen 80;
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
server {
    listen 8025;
    location / {
        proxy_pass http://mailpit:8025;
        proxy_set_header Host $http_host;
    }
}
