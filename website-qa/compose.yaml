name: nenotv-website-qa
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: nenotv_qa
      MARIADB_USER: nenotv_qa
      MARIADB_PASSWORD: local-qa-only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [isolated]
    volumes: ["db:/var/lib/mysql"]
  wordpress:
    image: wordpress:7.1.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: nenotv_qa
      WORDPRESS_DB_PASSWORD: local-qa-only
      WORDPRESS_DB_NAME: nenotv_qa
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('NENOTV_WEBSITE_QA', true);
    volumes: &wp_volumes
      - wordpress:/var/www/html
      - ./guard.php:/var/www/html/wp-content/mu-plugins/nenotv-qa-guard.php:ro
      - ../website-qa-v2/fixtures/qa-e2e-plugin.php:/var/www/html/wp-content/mu-plugins/nenotv-qa-e2e.php:ro
      - ./bootstrap.php:/qa/bootstrap.php:ro
    networks: [isolated]
  cli:
    image: wordpress:cli-2.12.0-php8.3
    entrypoint: ["wp"]
    user: "33:33"
    profiles: [tools]
    environment:
      <<: *wp_environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wordpress:/var/www/html
      - ./guard.php:/var/www/html/wp-content/mu-plugins/nenotv-qa-guard.php:ro
      - ../website-qa-v2/fixtures/qa-e2e-plugin.php:/var/www/html/wp-content/mu-plugins/nenotv-qa-e2e.php:ro
      - ./bootstrap.php:/qa/bootstrap.php:ro
      - ./network-check.php:/qa/network-check.php:ro
      - packages:/packages:ro
    networks: [isolated]
  downloader:
    image: curlimages/curl:8.14.1
    user: "0:0"
    profiles: [tools]
    volumes: ["packages:/packages"]
    networks: [downloads]
  mailpit:
    image: axllent/mailpit:v1.27
    networks: [isolated]
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8090:80", "127.0.0.1:8025:8025"]
    volumes: ["./proxy.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [wordpress, mailpit]
    networks: [isolated, downloads]
networks:
  isolated:
    internal: true
  downloads: {}
volumes:
  db: {}
  wordpress: {}
  packages: {}
