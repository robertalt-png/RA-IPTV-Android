plugins {
    id 'com.android.application'
}

def nenotvCastReceiverId = project.findProperty('NENOTV_CAST_RECEIVER_ID') ?: System.getenv('NENOTV_CAST_RECEIVER_ID') ?: ''

android {
    namespace 'com.nenotv.player'
    compileSdk 36

    defaultConfig {
        testInstrumentationRunner "com.nenotv.player.UiInstrumentation"
        applicationId 'com.nenotv.player'
        minSdk 26
        targetSdk 36
        versionCode 129
        versionName '0.14.35'
        buildConfigField 'String', 'NENOTV_CAST_RECEIVER_ID', '"' + nenotvCastReceiverId + '"'
        buildConfigField 'boolean', 'LIGHT_BUILD', 'false'
    
        def demoUrl = (System.getenv('NENOTV_DEMO_M3U_URL') ?: 'nenotv://demo/v1').replace('\\','\\\\').replace('"','\\"')
        buildConfigField 'String', 'NENOTV_DEMO_M3U_URL', '"' + demoUrl + '"'
}

    buildFeatures { buildConfig true }
    dynamicFeatures = [':proextras']

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*']
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    // SunnyIPTV Pro is sold only through Google Play; the server verifies and acknowledges every purchase.
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    // Dolby (AC3/E-AC3), DTS (incl. DTS-HD), TrueHD etc. when the device cannot decode or pass them through.
    // Built by tools/build-ffmpeg-audio.sh (FFmpeg n6.0.1, LGPL 2.1+, audio decoders only).
    implementation files('libs/ffmpeg/media3-decoder-ffmpeg-audio.aar')
    implementation 'androidx.media3:media3-decoder:1.11.1'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.fragment:fragment:1.8.9'
}
