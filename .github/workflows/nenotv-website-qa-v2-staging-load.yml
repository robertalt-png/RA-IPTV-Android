name: NenoTV Website QA v2 Staging Load
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    environment: nenotv-staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Guard staging target
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: website-qa-v2
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_QA_ENABLED: ${{ vars.STAGING_QA_ENABLED }}
        run: node scripts/staging-guard.mjs
      - name: Read-only staging load
        working-directory: website-qa-v2
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: k6 run k6/staging-readonly.js
