name: Build NenoTV Admin APK

on:
  push:
    branches: [ nenotv-admin-v0.1.0 ]
    paths:
      - 'adminapp/**'
      - '.github/workflows/build-admin-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p adminapp :app:assembleRelease --stacktrace
          cp adminapp/app/build/outputs/apk/release/app-release-unsigned.apk NenoTV-Admin-v0.1.2-unsigned.apk
          sha256sum NenoTV-Admin-v0.1.2-unsigned.apk > SHA256SUMS.txt
          test -s NenoTV-Admin-v0.1.2-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NenoTV-Admin-v0.1.2-release
          path: |
            NenoTV-Admin-v0.1.2-unsigned.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
