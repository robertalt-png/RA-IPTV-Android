name: Build NenoTV Admin v0.1

on:
  push:
    branches: [ nenotv-admin-v0.1 ]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-admin-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        working-directory: admin-app
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache clean :app:assembleRelease

      - name: Sign test APK
        run: |
          set -euo pipefail
          RAW="admin-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RAW"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/nenotv-admin-test.jks" -storepass android -alias nenotvadmin -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=NenoTV Admin QA,O=NenoTV,C=NL" >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$RAW" NenoTV-Admin-v0.1.0-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/nenotv-admin-test.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias nenotvadmin --out NenoTV-Admin-v0.1.0-TEST-SIGNED.apk NenoTV-Admin-v0.1.0-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs NenoTV-Admin-v0.1.0-TEST-SIGNED.apk | tee admin-signature.txt
          sha256sum NenoTV-Admin-v0.1.0-TEST-SIGNED.apk | tee NenoTV-Admin-v0.1.0-SHA256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$GITHUB_WORKSPACE/NenoTV-Admin-v0.1.0-TEST-SIGNED.apk"
            adb logcat -c
            adb shell monkey -p com.nenotv.admin -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 5
            adb logcat -d > "$GITHUB_WORKSPACE/admin-startup-logcat.txt"
            if grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/admin-startup-logcat.txt"; then cat "$GITHUB_WORKSPACE/admin-startup-logcat.txt"; exit 2; fi
            test -n "$(adb shell pidof com.nenotv.admin | tr -d '\r')"

      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-Admin-v0.1.0
          path: |
            NenoTV-Admin-v0.1.0-TEST-SIGNED.apk
            NenoTV-Admin-v0.1.0-SHA256.txt
            admin-signature.txt
            admin-startup-logcat.txt
          if-no-files-found: error
          retention-days: 90
