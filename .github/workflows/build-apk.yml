name: Build Android APK

on:
  push:
    branches: [ main, nivaro-v0.5.0-build-20260924, nivaro-v0.5.1-recording-20260925, nivaro-v0.5.2-compact-grid-20260925, nivaro-v0.5.3-stability-20260925, nivaro-v0.5.4-anr-fix-20260925, nivaro-v0.5.5-language-20260925, nivaro-v0.5.6-language-memory-20260925, nivaro-v0.5.7-rotation-state-20260925, nivaro-v0.5.8-cache-hero-20260925, nivaro-v0.5.9-db-paging-20260925, nivaro-v0.6.0-vertical-grid-20260925 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat cleanv2/p00 cleanv2/p01 cleanv2/p02 cleanv2/p03 cleanv2/p04 cleanv2/p05 cleanv2/p06 cleanv2/p07 > source.b64
          test "$(wc -c < source.b64)" -eq 46924
          echo "4c274c5647b85941952c3d59e2133f7dd9f134f239ceea1adc41051e97b8198e  source.b64" | sha256sum -c -
          base64 --decode source.b64 > source.zip
          echo "cf47b084a4af078c45db5b756ab54b3717f6879a107026e0315601ed9c75266e  source.zip" | sha256sum -c -
          unzip -t source.zip
          rm -rf source
          unzip -q source.zip -d source
          test -f source/RA_IPTV_Android_v0.1/settings.gradle
          test -f source/RA_IPTV_Android_v0.1/app/build.gradle

      - name: Apply v0.2.0 redesign
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v0.2.0/parts/p00 patches/v0.2.0/parts/p01 patches/v0.2.0/parts/p02 patches/v0.2.0/parts/p03 patches/v0.2.0/parts/p04 patches/v0.2.0/parts/p05 > overlay.b64
          test "$(wc -c < overlay.b64)" -eq 34828
          echo "13309bb713a32ebc1f1b61112aaf263393f57b17d09da6c7b9e30a752fc36a89  overlay.b64" | sha256sum -c -
          base64 --decode overlay.b64 > overlay.zip
          echo "b54f5b159bb5e67834549f292887df98aab4770bffc5760a075d97b457dda5c9  overlay.zip" | sha256sum -c -
          unzip -t overlay.zip
          unzip -qo overlay.zip -d source/RA_IPTV_Android_v0.1
          grep -q "versionName '0.2.0'" source/RA_IPTV_Android_v0.1/app/build.gradle

      - name: Apply final v0.2.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v0.2.1-final/parts/p00 patches/v0.2.1-final/parts/p01 patches/v0.2.1-final/parts/p02 patches/v0.2.1-final/parts/p03 patches/v0.2.1-final/parts/p04 patches/v0.2.1-final/parts/p05 patches/v0.2.1-final/parts/p06 > final021.b64
          test "$(wc -c < final021.b64)" -eq 33084
          echo "ec87b0ac60e44028c7ee15c52ef907efeb4a4505d51382c9ccea432ead0870cd  final021.b64" | sha256sum -c -
          base64 --decode final021.b64 > final021.zip
          echo "14c3f2694a5c546767704c069b9094eacd211998cf836f16ec5966d094466926  final021.zip" | sha256sum -c -
          unzip -t final021.zip
          unzip -qo final021.zip -d source/RA_IPTV_Android_v0.1
          grep -q "versionName '0.2.1'" source/RA_IPTV_Android_v0.1/app/build.gradle
          grep -q "Anti-freeze" source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/PlayerActivity.java
          grep -q "heroImage" source/RA_IPTV_Android_v0.1/app/src/main/res/layout/activity_main.xml
          grep -q "episodeCandidates" source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/core/XtreamUrls.java

      - name: Apply final v0.2.2 startup and navigation patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v0.2.2-final2/parts/p00 patches/v0.2.2-final2/parts/p01 patches/v0.2.2-final2/parts/p02 patches/v0.2.2-final2/parts/p03 patches/v0.2.2-final2/parts/p04 patches/v0.2.2-final2/parts/p05 patches/v0.2.2-final2/parts/p06 > final022.b64
          test "$(wc -c < final022.b64)" -eq 12516
          echo "8030ddeeb59391caf43a2785c1b318d3ff0e9c840c0d084679a960c6f18b73f9  final022.b64" | sha256sum -c -
          base64 --decode final022.b64 > final022.zip
          echo "93f6dc5f1ed0e2bb7e4813b5d9172f4f7d3bfd5084719c9da23b5977899667ff  final022.zip" | sha256sum -c -
          unzip -t final022.zip
          unzip -qo final022.zip -d source/RA_IPTV_Android_v0.1
          grep -q "versionName '0.2.2'" source/RA_IPTV_Android_v0.1/app/build.gradle
          grep -q "navFavorites" source/RA_IPTV_Android_v0.1/app/src/main/res/layout/activity_main.xml
          ! grep -q "liveButton" source/RA_IPTV_Android_v0.1/app/src/main/res/layout/activity_main.xml
          grep -q "Klaar · kies Live tv" source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/MainActivity.java

