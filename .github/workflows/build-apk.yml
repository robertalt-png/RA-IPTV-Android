      - name: Upload Nivaro source
        uses: actions/upload-artifact@v4
        with:
          name: Nivaro-v0.6.0-source
          path: Nivaro-v0.6.0-source.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug and unsigned release APK
        working-directory: source/RA_IPTV_Android_v0.1
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          test -f source/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk
          test -f source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh source/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum source/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"

      - name: Upload unsigned release and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: Nivaro-v0.6.0-unsigned-release
          path: |
            source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
            /opt/hostedtoolcache/Android_SDK/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nivaro-IPTV-Player-v0.6.0-debug-apk
          path: source/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
