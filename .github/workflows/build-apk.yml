              <path android:fillColor="#0B0E14" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#181D27" android:pathData="M10,10h88v88h-88z"/>
              <path android:fillColor="#F04455"
                  android:pathData="M26,80 L26,28 L40,28 L68,62 L68,28 L82,28 L82,80 L68,80 L40,46 L40,80 Z"/>
