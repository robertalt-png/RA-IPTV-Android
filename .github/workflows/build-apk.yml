name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        run: |
          cat buildsrc/source.b64.part* > source.b64
          base64 --decode source.b64 > source.zip
          unzip -q source.zip -d source
          test -d source/RA_IPTV_Android_v0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: source/RA_IPTV_Android_v0.1
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        working-directory: source/RA_IPTV_Android_v0.1
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RA-IPTV-Android-v0.1.0-debug
          path: source/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# Source archive complete: 10/10 parts
