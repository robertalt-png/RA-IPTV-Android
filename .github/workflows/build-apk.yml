name: Build Nivaro v0.4.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nivaro v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          echo "1d31cf30c35031657fe5d416bdb726515e7bfb3b297123202fd33d643e4f24b7  source_archives/Nivaro-v0.4.0-source.tar.gz" | sha256sum -c -
          mkdir -p source
          tar -xzf source_archives/Nivaro-v0.4.0-source.tar.gz -C source
          test -f source/RA_IPTV_Android_v0.1/settings.gradle
          grep -q "versionName '0.4.0'" source/RA_IPTV_Android_v0.1/app/build.gradle
          grep -q 'navEpg' source/RA_IPTV_Android_v0.1/app/src/main/res/layout/activity_main.xml
          grep -q 'showGenreChooser' source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/MainActivity.java
          grep -q 'class MediaDetails' source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/model/MediaDetails.java
          grep -q 'showEpgDetails' source/RA_IPTV_Android_v0.1/app/src/main/java/com/robertalt/raiptv/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: source/RA_IPTV_Android_v0.1
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: Nivaro-v0.4.0-unsigned-release
          path: source/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
