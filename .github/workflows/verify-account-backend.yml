name: Verify NenoTV account backend
on:
  push:
    branches: [nenotv-update-notifications]
    paths: ['server/nenotv-entitlement-core.php', 'server/nenotv-pairing.php', 'tools/tests/pairing-backend.php', '.github/workflows/verify-account-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -v
          php -l server/nenotv-entitlement-core.php
          php -l server/nenotv-pairing.php
      - name: Verify pairing and device authorization
        run: php tools/tests/pairing-backend.php
