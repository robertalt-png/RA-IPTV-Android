name: SunnyIPTV FFmpeg audio extension (LGPL)

# Stand-alone check of tools/build-ffmpeg-audio.sh: Media3 FFmpeg audio decoder for Dolby (AC3/E-AC3),
# DTS (incl. DTS-HD), TrueHD and more, without VLC. FFmpeg stays LGPL 2.1+ (the script fails otherwise).

on:
  push:
    branches: [sunnyiptv-ffmpeg-audio]
    paths: ['.github/workflows/build-ffmpeg-audio.yml', 'tools/build-ffmpeg-audio.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Build
        run: NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125" bash tools/build-ffmpeg-audio.sh out
      - name: Summary
        run: |
          { echo "### FFmpeg audio extension"; echo '```'; cat out/licence.txt out/ffmpeg-source.txt; echo; cat out/sizes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg-audio
          path: out/
          retention-days: 90
