name: Build NenoTV v0.9.8

on:
  push:
    branches: [ nenotv-v0.9.8-free-pro ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Get base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          cd base
          gh run download 36349587668 --repo robertalt-png/RA-IPTV-Android --name Nivaro-v0.9.5-build
          tar -xzf Nivaro-v0.9.5-source.tar.gz

      - name: Apply NenoTV changes
        run: |
          cd base/RA_IPTV_Android_v0.1
          for p in build-gradle manifest strings main settings profile player; do
            git apply "$GITHUB_WORKSPACE/patches/v0.9.8-free-pro/plain/$p.patch"
          done
          mkdir -p app/src/main/java/com/robertalt/raiptv/entitlement
          cp "$GITHUB_WORKSPACE/patches/v0.9.8-free-pro/files/AccountActivity.java" app/src/main/java/com/robertalt/raiptv/
          cp "$GITHUB_WORKSPACE/patches/v0.9.8-free-pro/files/ProGate.java" app/src/main/java/com/robertalt/raiptv/
          cp "$GITHUB_WORKSPACE/patches/v0.9.8-free-pro/files/EntitlementClient.java" app/src/main/java/com/robertalt/raiptv/entitlement/
          cp "$GITHUB_WORKSPACE/patches/v0.9.8-free-pro/files/EntitlementStore.java" app/src/main/java/com/robertalt/raiptv/storage/
          sed -i 's/BuildConfig.NENOTV_API_BASE.trim()/"https:\/\/nenotv.com"/' app/src/main/java/com/robertalt/raiptv/entitlement/EntitlementClient.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build
        working-directory: base/RA_IPTV_Android_v0.1
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Package
        run: |
          cp base/RA_IPTV_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk NenoTV-v0.9.8-debug.apk
          cp base/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk NenoTV-v0.9.8-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          tar -czf NenoTV-Android-v0.9.8-source.tar.gz -C base RA_IPTV_Android_v0.1

      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-v0.9.8-build
          path: |
            NenoTV-v0.9.8-debug.apk
            NenoTV-v0.9.8-unsigned.apk
            NenoTV-Android-v0.9.8-source.tar.gz
            apksigner.jar
