      - name: Prepare NenoTV Free core
        run: |
          set -euo pipefail
          cd base/RA_IPTV_Android_v0.1
          python3 "$GITHUB_WORKSPACE/tools/prepare_free.py"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show Free source version
        run: |
          grep -n "applicationId\|versionCode\|versionName" base/RA_IPTV_Android_v0.1/app/build.gradle || true
          grep -n "libvlc\|mlkit:translate\|language-id" base/RA_IPTV_Android_v0.1/app/build.gradle || true

      - name: Build NenoTV Free APK
        working-directory: base/RA_IPTV_Android_v0.1
        run: |
          set -euo pipefail
          rm -rf app/build build .gradle
          gradle --no-daemon --no-build-cache --rerun-tasks clean assembleRelease

      - name: Verify and align Free APK
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          IN="base/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$AAPT" dump badging "$IN" | tee free-badging.txt
          grep -q "package: name='com.robertalt.raiptv' versionCode='50' versionName='0.12.1'" free-badging.txt
          "$ZIPALIGN" -p -f 4 "$IN" NenoTV-Free-v0.12.1-aligned-unsigned.apk
          "$ZIPALIGN" -c -p 4 NenoTV-Free-v0.12.1-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          ls -lh NenoTV-Free-v0.12.1-aligned-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-Free-v0.12.1-build
          path: |
            NenoTV-Free-v0.12.1-aligned-unsigned.apk
            free-badging.txt
            apksigner.jar
