      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show source version
        working-directory: base/RA_IPTV_Android_v0.1
        run: |
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle || true

      - name: Clean build
        working-directory: base/RA_IPTV_Android_v0.1
        run: |
          set -euo pipefail
          rm -rf app/build build .gradle
          gradle --no-daemon --no-build-cache --rerun-tasks clean assembleRelease

      - name: Verify and align APK
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          IN="base/RA_IPTV_Android_v0.1/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$AAPT" dump badging "$IN" | tee apk-badging.txt
          grep -q "package: name='com.robertalt.raiptv' versionCode='44' versionName='0.10.2'" apk-badging.txt
          "$ZIPALIGN" -p -f 4 "$IN" NenoTV-v0.10.2-aligned-unsigned.apk
          "$ZIPALIGN" -c -p 4 NenoTV-v0.10.2-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-v0.10.2-build
          path: |
            NenoTV-v0.10.2-aligned-unsigned.apk
            apksigner.jar
