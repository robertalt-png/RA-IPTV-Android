name: Google Play-only testing and Pro rewards
on:
  push:
    branches: [simplify-google-play-testing-0146]
  pull_request:
    branches: [sunnyiptv-0.14.46]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: PHP syntax
        run: php -l server/sunnyiptv-google-play-test-rewards.php
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build app, tests and Play bundle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - name: Test approved reward refresh on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e phase play_rewards com.nenotv.player.test/com.nenotv.player.UiInstrumentation | tee reward-tests.txt
            grep -q 'SUNNYIPTV_PLAY_REWARDS=passed' reward-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunnyIPTV-0.14.47-Google-Play-testing
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            reward-tests.txt

