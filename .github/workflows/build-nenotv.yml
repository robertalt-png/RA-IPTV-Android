name: SunnyIPTV one app v0.14.37
on:
  push:
    branches: [nenotv-v0.13.11-work-handoff, nenotv-pro-2.0, nenotv-update-notifications, nenotv-catalog-package-0143, nenotv-website-onboarding-0144, sunnyiptv-branding-0146, sunnyiptv-fase1-import, sunnyiptv-0.14.22, sunnyiptv-0.14.23, sunnyiptv-0.14.24, sunnyiptv-0.14.25, sunnyiptv-0.14.26, sunnyiptv-0.14.27, sunnyiptv-0.14.28, sunnyiptv-0.14.29, sunnyiptv-0.14.30, sunnyiptv-0.14.31, sunnyiptv-0.14.32, sunnyiptv-0.14.33, sunnyiptv-0.14.34, sunnyiptv-0.14.35, sunnyiptv-0.14.36, sunnyiptv-0.14.37]
  pull_request:
    branches: [nenotv-v0.13.11-work-handoff]
    paths: ['android/**', '.github/workflows/build-nenotv.yml', 'tools/qa-one-app.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nenotv-one-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: QA tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep php-cli
      - name: QA signing key (stable when the QA_KEYSTORE_B64 secret is set)
        env:
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          # A stable test key lets each test APK install over the previous one, keeping pairing, list and settings.
          # The secret holds a base64 PKCS12/JKS keystore with alias androiddebugkey and passwords "android".
          if [ -n "$QA_KEYSTORE_B64" ]; then printf '%s' "$QA_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"; touch "$HOME/.android/stable-qa-key"; echo "Using stable QA key from secret"; else echo "QA_KEYSTORE_B64 not set: generating a disposable key (test APKs will not update over each other)"; fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SunnyIPTV QA,O=SunnyIPTV,C=NL"; fi
      - name: Update notification policy tests
        run: |
          bash tools/test-update-policy.sh
          php -l server/nenotv-release-notifications.php
          php tools/tests/ReleaseNotificationsTest.php
          php -l server/nenotv-entitlement-core.php
          php -l server/nenotv-catalog-package.php
          php -l server/nenotv-catalog-format.php
          NENOTV_EXPORT_FIXTURE=1 php tools/tests/catalog-package-test.php
          php tools/tests/source-manager-test.php
          php tools/tests/free-account/test-free-pairing.php
      - name: Family demo catalogue tests
        run: |
          python3 tools/tests/test_family_demo.py
          python3 tools/tests/check_texts.py
          php tools/tests/account-setup/test-account-setup.php
          php tools/tests/account-setup/test-play-billing.php
          php -l server/sunnyiptv-play-billing.php
      - name: Import speed-up equivalence (language detection and index text)
        run: |
          rm -rf build/lang
          javac -d build/lang $(cat tools/tests/language/sources.txt)
          java -Xmx2g -cp build/lang com.nenotv.player.ContentLanguageEquivalence
          java -cp build/lang com.nenotv.player.storage.IndexTextEquivalence
      - name: FFmpeg audio decoder cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/ffmpeg
          key: ffmpeg-audio-${{ hashFiles('tools/build-ffmpeg-audio.sh') }}
      - name: Build FFmpeg audio decoder (LGPL, only when the cache is empty)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125" bash tools/build-ffmpeg-audio.sh android/app/libs/ffmpeg
      - name: FFmpeg audio decoder licence and sizes
        run: cat android/app/libs/ffmpeg/licence.txt android/app/libs/ffmpeg/ffmpeg-source.txt android/app/libs/ffmpeg/sizes.txt
      - name: Build the single app source
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:bundleRelease :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
            grep -E '(error:|^e: |warning: \[|What went wrong|Lint found|\.(java|kt|xml):[0-9]+)' "$RUNNER_TEMP/gradle-build.log" | grep -v '^Note:' | head -12 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          fi
      - name: Generate test APK from the exact Play AAB
        run: |
          mkdir -p distribution qa-tools
          cp android/app/build/outputs/bundle/release/app-release.aab distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab
          curl -L --fail --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o qa-tools/bundletool.jar
          java -jar qa-tools/bundletool.jar validate --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab
          java -jar qa-tools/bundletool.jar dump manifest --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab --module=base > distribution/base-release-manifest.xml
          java -jar qa-tools/bundletool.jar dump manifest --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab --module=proextras > distribution/pro-release-manifest.xml
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          ns='{http://schemas.android.com/apk/res/android}'
          report={}
          for module in ('base','pro'):
            root=ET.parse('distribution/'+module+'-release-manifest.xml').getroot()
            permissions=sorted({e.get(ns+'name') for e in root if e.tag.startswith('uses-permission') and e.get(ns+'name')})
            report[module]={'permissions':permissions,'advertising_id_permission':'com.google.android.gms.permission.AD_ID' in permissions}
          with open('distribution/permission-audit.json','w') as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
          java -jar qa-tools/bundletool.jar build-apks --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab --output=pro-universal.apks --mode=universal --ks="$HOME/.android/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p pro-universal.apks universal.apk > distribution/SunnyIPTV-Pro-v0.14.37-vc131-TEST-SIGNED.apk
          java -jar qa-tools/bundletool.jar build-apks --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab --output=light-universal.apks --mode=universal --modules=base --ks="$HOME/.android/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p light-universal.apks universal.apk > distribution/SunnyIPTV-Light-v0.14.37-vc131-TEST-SIGNED.apk
          echo '{"supportedAbis":["x86_64"],"supportedLocales":["en"],"screenDensity":420,"sdkVersion":35}' > qa-tools/device.json
          java -jar qa-tools/bundletool.jar build-apks --bundle=distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab --output=qa-tools/phone.apks --local-testing --device-spec=qa-tools/device.json --ks="$HOME/.android/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out qa-tools/tests.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs qa-tools/tests.apk > distribution/test-signature.txt
          diff <(rg 'Signer #1 certificate SHA-256 digest' distribution/test-signature.txt) <("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs distribution/SunnyIPTV-Pro-v0.14.37-vc131-TEST-SIGNED.apk | rg 'Signer #1 certificate SHA-256 digest')
          diff <(rg 'Signer #1 certificate SHA-256 digest' distribution/test-signature.txt) <("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs distribution/SunnyIPTV-Light-v0.14.37-vc131-TEST-SIGNED.apk | rg 'Signer #1 certificate SHA-256 digest')
          # Never publish a stable key: the repository and its artifacts are public.
          if [ ! -f "$HOME/.android/stable-qa-key" ]; then cp "$HOME/.android/debug.keystore" qa-tools/disposable-QA-key.jks; fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/SunnyIPTV-Pro-v0.14.37-vc131-TEST-SIGNED.apk > distribution/qa-signature-pro.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/SunnyIPTV-Light-v0.14.37-vc131-TEST-SIGNED.apk > distribution/qa-signature-light.txt
          sha256sum distribution/SunnyIPTV-Pro-v0.14.37-vc131-TEST-SIGNED.apk distribution/SunnyIPTV-Light-v0.14.37-vc131-TEST-SIGNED.apk distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab > distribution/SHA256.txt
      - name: Verify Light base and Pro separation
        run: |
          python - <<'PY'
          import zipfile,collections
          with zipfile.ZipFile('distribution/SunnyIPTV-v0.14.37-vc131-UNSIGNED.aab') as z:
            names=z.namelist()
            heavy=('libvlc.so','libvlcjni.so','libtranslate_jni.so','liblanguage_id_l2c_jni.so')
            assert not any(n.startswith('base/') and any(h in n for h in heavy) for n in names)
            assert any(n.startswith('proextras/') and any(h in n for h in heavy) for n in names)
            # VLC is removed; Dolby/DTS/TrueHD come from the LGPL FFmpeg audio decoder in the base app.
            assert not any('libvlc' in n for n in names), 'VLC must not be in the bundle'
            assert any(n.startswith('base/lib/') and n.endswith('/libffmpegJNI.so') for n in names), 'FFmpeg audio decoder missing from base'
            sizes=collections.defaultdict(int)
            for i in z.infolist():
              if i.filename.startswith('base/lib/') and i.filename.endswith('/libffmpegJNI.so'): sizes[i.filename.split('/')[2]]+=i.file_size
            print('FFmpeg audio decoder per ABI (MB):',{k:round(v/1048576,2) for k,v in sizes.items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyIPTV-v0.14.37-Play-bundle
          path: |
            distribution/*.aab
            distribution/SHA256.txt
            distribution/*-release-manifest.xml
            distribution/permission-audit.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyIPTV-Light-v0.14.37-test-app
          path: |
            distribution/SunnyIPTV-Light-v0.14.37-vc131-TEST-SIGNED.apk
            distribution/SHA256.txt
            distribution/qa-signature-light.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyIPTV-Pro-v0.14.37-test-app
          path: |
            distribution/SunnyIPTV-Pro-v0.14.37-vc131-TEST-SIGNED.apk
            distribution/SHA256.txt
            distribution/qa-signature-pro.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyIPTV-v0.14.37-QA-tools
          path: qa-tools/
          retention-days: 7
  android-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 35
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - device: tv
            api: 31
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: SunnyIPTV-Light-v0.14.37-test-app
          path: distribution
      - uses: actions/download-artifact@v4
        with:
          name: SunnyIPTV-Pro-v0.14.37-test-app
          path: distribution
      - uses: actions/download-artifact@v4
        with:
          name: SunnyIPTV-v0.14.37-QA-tools
          path: qa-tools
      - name: QA tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep php-cli
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/qa-one-app.sh ${{ matrix.device }}
      - name: Capture failure evidence
        if: always()
        run: |
          mkdir -p qa-results
          if [ ! -s qa-results/logcat.txt ]; then timeout 15s adb logcat -d > qa-results/logcat.txt || true; fi
          timeout 20s adb pull /sdcard/Android/data/com.nenotv.player/files/qa qa-results/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunnyIPTV-v0.14.37-${{ matrix.device }}-test-evidence
          path: qa-results/
          retention-days: 30
