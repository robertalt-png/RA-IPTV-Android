name: NenoTV one app v0.14.0
on:
  push:
    branches: [nenotv-v0.13.11-work-handoff, nenotv-pro-2.0]
  pull_request:
    branches: [nenotv-v0.13.11-work-handoff]
    paths: ['android/**', '.github/workflows/build-nenotv.yml', 'tools/qa-one-app.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nenotv-one-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: QA tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Disposable QA signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NenoTV QA,O=NenoTV,C=NL"; fi
      - name: Build the single app source
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease :app:assembleDebugAndroidTest
      - name: Generate test APK from the exact Play AAB
        run: |
          mkdir -p distribution qa-tools
          cp android/app/build/outputs/bundle/release/app-release.aab distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab
          curl -L --fail --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o qa-tools/bundletool.jar
          java -jar qa-tools/bundletool.jar validate --bundle=distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab
          java -jar qa-tools/bundletool.jar build-apks --bundle=distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab --output=universal.apks --mode=universal --ks="$HOME/.android/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p universal.apks universal.apk > distribution/NenoTV-v0.14.0-vc93-TEST-SIGNED.apk
          echo '{"supportedAbis":["x86_64"],"supportedLocales":["en"],"screenDensity":420,"sdkVersion":35}' > qa-tools/device.json
          java -jar qa-tools/bundletool.jar build-apks --bundle=distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab --output=qa-tools/phone.apks --local-testing --device-spec=qa-tools/device.json --ks="$HOME/.android/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out qa-tools/tests.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs qa-tools/tests.apk > distribution/test-signature.txt
          diff <(rg 'Signer #1 certificate SHA-256 digest' distribution/test-signature.txt) <("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs distribution/NenoTV-v0.14.0-vc93-TEST-SIGNED.apk | rg 'Signer #1 certificate SHA-256 digest')
          cp "$HOME/.android/debug.keystore" qa-tools/disposable-QA-key.jks
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/NenoTV-v0.14.0-vc93-TEST-SIGNED.apk > distribution/qa-signature.txt
          sha256sum distribution/NenoTV-v0.14.0-vc93-TEST-SIGNED.apk distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab > distribution/SHA256.txt
      - name: Verify Light base and Pro separation
        run: |
          python - <<'PY'
          import zipfile,collections
          with zipfile.ZipFile('distribution/NenoTV-v0.14.0-vc93-UNSIGNED.aab') as z:
            names=z.namelist()
            heavy=('libvlc.so','libvlcjni.so','libtranslate_jni.so','liblanguage_id_l2c_jni.so')
            assert not any(n.startswith('base/') and any(h in n for h in heavy) for n in names)
            assert any(n.startswith('proextras/') and any(h in n for h in heavy) for n in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-v0.14.0-Play-bundle
          path: |
            distribution/*.aab
            distribution/SHA256.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-v0.14.0-test-app
          path: |
            distribution/*.apk
            distribution/SHA256.txt
            distribution/qa-signature.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: NenoTV-v0.14.0-QA-tools
          path: qa-tools/
          retention-days: 7
  android-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 35
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - device: tv
            api: 31
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: NenoTV-v0.14.0-test-app
          path: distribution
      - uses: actions/download-artifact@v4
        with:
          name: NenoTV-v0.14.0-QA-tools
          path: qa-tools
      - name: QA tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/qa-one-app.sh ${{ matrix.device }}
      - name: Capture failure evidence
        if: always()
        run: |
          mkdir -p qa-results
          if [ ! -s qa-results/logcat.txt ]; then timeout 15s adb logcat -d > qa-results/logcat.txt || true; fi
          timeout 20s adb pull /sdcard/Android/data/com.nenotv.player/files/qa qa-results/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NenoTV-v0.14.0-${{ matrix.device }}-test-evidence
          path: qa-results/
          retention-days: 30
