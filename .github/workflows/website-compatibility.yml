name: NenoTV website compatibility 0.14.2
on:
  push:
    branches: [nenotv-website-0142-compatibility-qa]
permissions:
  contents: read
jobs:
  php-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and account/source compatibility
        run: |
          php -l server/nenotv-entitlement-core.php
          php -l server/nenotv-pairing.php
          php -l website-qa/theme-functions.php
          php tools/tests/pairing-backend.php
