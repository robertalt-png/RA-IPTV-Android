name: Build NenoTV Admin APK

on:
  push:
    branches: [ nenotv-admin-v0.2.0 ]
    paths:
      - 'dashboard-app/**'
      - '.github/workflows/build-dashboard-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p dashboard-app --no-daemon :app:assembleDebug
          test -f dashboard-app/app/build/outputs/apk/debug/app-debug.apk
          cp dashboard-app/app/build/outputs/apk/debug/app-debug.apk NenoTV-Admin-v0.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NenoTV-Admin-v0.2.0
          path: NenoTV-Admin-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
